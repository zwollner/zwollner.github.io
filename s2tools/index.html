<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shapez 2 Blueprint Converter</title>
    <meta name="description" content="Convert Shapez 2 blueprints between different game versions.">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        :root {
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-main);
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .dropzone {
            border: 2px dashed var(--card-border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }

        .dropzone p {
            margin: 0;
            color: var(--text-muted);
            pointer-events: none;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            appearance: none;
        }
        
        select option {
            background: var(--bg-grad-1);
        }

        .btn-container {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.success {
            background: var(--accent);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        }
        button.success:hover {
            background: #059669;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
        }

        .hidden {
            display: none !important;
        }

        #errorMsg {
            color: #ef4444;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .output-section {
            margin-top: 2rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Shapez 2 BP Converter</h1>
        <p class="subtitle">Instantly upgrade blueprints to newer game versions.</p>

        <div class="glass-panel">
            <div class="dropzone" id="dropzone">
                <p>Drag & Drop a .spz2bp file here, or click to browse</p>
                <input type="file" id="fileInput" accept=".spz2bp" class="hidden">
            </div>

            <div class="input-group">
                <label for="bpInput">Or Paste Blueprint String</label>
                <textarea id="bpInput" placeholder="SHAPEZ2-3-H4sI..."></textarea>
            </div>

            <div class="input-group">
                <label for="targetVersion">Target Version</label>
                <select id="targetVersion">
                    <option value="5">Version 5 (Game 1.2+)</option>
                    <option value="4">Version 4 (Game 1.0)</option>
                </select>
            </div>

            <div class="btn-container">
                <button id="convertBtn">Convert Blueprint</button>
            </div>
            
            <div id="errorMsg"></div>

            <div id="outputSection" class="output-section hidden">
                <div class="input-group">
                    <label for="bpOutput">Converted Blueprint</label>
                    <textarea id="bpOutput" readonly></textarea>
                </div>
                <div class="btn-container">
                    <button id="copyBtn">Copy to Clipboard</button>
                    <button id="downloadBtn" class="success">Download File</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function base64ToUint8Array(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes;
        }

        function uint8ArrayToBase64(bytes) {
            let binary = '';
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function decodeBp(data) {
            data = data.trim();
            if (!data.startsWith('SHAPEZ2-')) throw new Error("Invalid Blueprint format. Must start with SHAPEZ2-");
            
            const parts = data.split('-');
            const strVersion = parseInt(parts[1], 10);
            let b64Data = parts.slice(2).join('-');
            
            if (b64Data.endsWith('$')) b64Data = b64Data.slice(0, -1);
            
            let appendix = '';
            if (b64Data.includes('[]_')) {
                const idx = b64Data.lastIndexOf('[]_');
                appendix = b64Data.slice(idx);
                b64Data = b64Data.slice(0, idx);
            }
            
            const compressed = base64ToUint8Array(b64Data);
            const jsonStr = pako.inflate(compressed, { to: 'string' });
            const json = JSON.parse(jsonStr);
            return { strVersion, appendix, json };
        }

        function encodeBp(strVersion, appendix, json) {
            const jsonStr = JSON.stringify(json);
            const compressed = pako.gzip(jsonStr);
            let b64Data = uint8ArrayToBase64(compressed);
            return `SHAPEZ2-${strVersion}-${b64Data}${appendix}$`;
        }

        function addTypeFirst(obj, typeStr) {
            const entries = Object.entries(obj);
            for (const k of Object.keys(obj)) delete obj[k];
            obj['$type'] = typeStr;
            for (const [k, v] of entries) {
                if (k !== '$type') obj[k] = v;
            }
        }

        function upgrade4to5(json) {
            json.V = 1138;
            addTypeFirst(json, "Game.Core.Blueprint.Serialization.SerializableBlueprint, Game.Core.Blueprint.Serialization");
            
            if (json.BP) {
                delete json.BP.BinaryVersion;
                delete json.BP.Icon;
                
                if (Array.isArray(json.BP.Entries)) {
                    const arr = json.BP.Entries;
                    json.BP.Entries = {
                        "$type": "Game.Core.Blueprint.Serialization.SerializableIslandEntry[], Game.Core.Blueprint.Serialization",
                        "$values": arr
                    };
                }
                
                if (json.BP.Entries && json.BP.Entries.$values) {
                    for (const entry of json.BP.Entries.$values) {
                        entry.X = entry.X || 0;
                        entry.Y = entry.Y || 0;
                        entry.Z = entry.Z || 0;
                        entry.R = entry.R || 0;
                        entry.S = entry.S || null;
                        entry.C = entry.C || null;
                        addTypeFirst(entry, "Game.Core.Blueprint.Serialization.SerializableIslandEntry, Game.Core.Blueprint.Serialization");
                        
                        if (entry.B) {
                            delete entry.B.BinaryVersion;
                            delete entry.B.Icon;
                            
                            if (Array.isArray(entry.B.Entries)) {
                                const bArr = entry.B.Entries;
                                entry.B.Entries = {
                                    "$type": "Game.Core.Blueprint.Serialization.SerializableBuildingEntry[], Game.Core.Blueprint.Serialization",
                                    "$values": bArr
                                };
                            }
                            
                            if (entry.B.Entries && entry.B.Entries.$values) {
                                for (const bEntry of entry.B.Entries.$values) {
                                    bEntry.X = bEntry.X || 0;
                                    bEntry.Y = bEntry.Y || 0;
                                    bEntry.L = bEntry.L || 0;
                                    bEntry.R = bEntry.R || 0;
                                    
                                    if (bEntry.C !== undefined && bEntry.C !== null) {
                                        if (typeof bEntry.C === 'string') {
                                            bEntry.C = {
                                                "$type": "System.Byte[], mscorlib",
                                                "$value": bEntry.C
                                            };
                                        }
                                    } else {
                                        bEntry.C = null;
                                    }
                                    addTypeFirst(bEntry, "Game.Core.Blueprint.Serialization.SerializableBuildingEntry, Game.Core.Blueprint.Serialization");
                                }
                            }
                        }
                    }
                }
            }
        }

        function upgrade3to4(json) {
            json.V = 1137;
            if (json.BP) {
                json.BP.BinaryVersion = 1137;
                if (json.BP.Entries) {
                    for (const entry of json.BP.Entries) {
                        if (entry.B) {
                            entry.B.BinaryVersion = 1137;
                        }
                    }
                }
            }
        }

        function convertBlueprint(data, targetStrVersion) {
            let { strVersion, appendix, json } = decodeBp(data);
            
            if (strVersion > targetStrVersion) {
                throw new Error(`Cannot downgrade from v${strVersion} to v${targetStrVersion}`);
            }

            while (strVersion < targetStrVersion) {
                if (strVersion === 3) {
                    upgrade3to4(json);
                    strVersion = 4;
                } else if (strVersion === 4) {
                    upgrade4to5(json);
                    strVersion = 5;
                } else {
                    throw new Error(`Unsupported conversion from v${strVersion}`);
                }
            }
            
            return encodeBp(strVersion, appendix, json);
        }

        // --- UI Logic ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const bpInput = document.getElementById('bpInput');
        const bpOutput = document.getElementById('bpOutput');
        const targetVersion = document.getElementById('targetVersion');
        const convertBtn = document.getElementById('convertBtn');
        const outputSection = document.getElementById('outputSection');
        const errorMsg = document.getElementById('errorMsg');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalFilename = "converted.spz2bp";

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            originalFilename = file.name.replace('.spz2bp', '') + '_converted.spz2bp';
            const reader = new FileReader();
            reader.onload = (e) => {
                bpInput.value = e.target.result;
            };
            reader.readAsText(file);
        }

        convertBtn.addEventListener('click', () => {
            errorMsg.textContent = '';
            outputSection.classList.add('hidden');
            
            const data = bpInput.value.trim();
            if (!data) {
                errorMsg.textContent = "Please paste a blueprint or select a file.";
                return;
            }

            const targetVer = parseInt(targetVersion.value, 10);
            
            try {
                const result = convertBlueprint(data, targetVer);
                bpOutput.value = result;
                outputSection.classList.remove('hidden');
                
                // Scroll to output
                outputSection.scrollIntoView({ behavior: 'smooth' });
            } catch(err) {
                errorMsg.textContent = err.message;
            }
        });

        copyBtn.addEventListener('click', () => {
            bpOutput.select();
            document.execCommand('copy');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([bpOutput.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
